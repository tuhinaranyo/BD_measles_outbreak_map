name: Update public alert data

# Reads official DGHS reports and writes verified JSON to the "alerts-data" branch.
# The website reads that branch. This job does not touch the Streamlit app or its data.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "List pages to scan (10 reports each)"
        default: "2"
  schedule:
    # Bangladesh is UTC+6. Hourly from 14:37 to 00:37, then 04:37, 06:37 and 10:37.
    - cron: "37 8-18 * * *"
    - cron: "37 0,4,22 * * *"

concurrency:
  group: public-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: alerts-data
          path: alerts-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: public_alerts/requirements.txt

      - run: python -m pip install -r public_alerts/requirements.txt

      - name: Test the parsers
        run: python -m unittest discover -s public_alerts/tests -t .

      - name: Fetch and verify new reports
        id: fetch
        continue-on-error: true
        env:
          PAGES: ${{ inputs.pages || '2' }}
          PYTHONIOENCODING: utf-8
        run: python -m public_alerts --out alerts-data --pages "$PAGES"

      - name: Publish data
        working-directory: alerts-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          git diff --cached --quiet && exit 0
          git commit -m "Update alert data"
          git push || { git pull --rebase && git push; }

      - name: Report a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::The fetch failed. The website keeps the last verified data and shows a warning."
          exit 1
